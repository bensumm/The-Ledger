# GATING repo checks — `checks` is a REQUIRED status check on `main` since G1 (2026-07-04); the
# ruleset also requires a PR and forbids force-push/deletion. Repository admins carry an always-on
# bypass, so an attended direct-push still lands and CI runs AFTER it — watch the run, don't assume
# the push implies green (/ship §2/§3).
# Runs the same checks agents run locally (CLAUDE.md rule 2 + the auto-discovered test suites):
# nothing here needs secrets or Ben's machine — the fills *sync* itself can never move to CI (it
# reads ~/.runelite locally). That sync is ON-DEMAND ONLY: the `CofferFillsSync` scheduled task was
# ELIMINATED 2026-07-04 (pipeline/FILLS-PIPELINE.md §12), so Task Scheduler is NOT its home — the
# only scheduled job left in this repo is the zero-git cache-warm guard.
#
# Action majors are pinned to @v5 (Node 24 runtime, requires runner >= v2.327.1 — GitHub-hosted
# ubuntu-latest satisfies this). Bumped from @v4 on 2026-07-28: v4 targets the retired Node 20 and
# was already being force-run on Node 24 with a deprecation annotation on every run.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check all JS modules
        run: |
          set -e
          for f in js/*.js $(find pipeline -name '*.mjs'); do
            node --check "$f"
          done
          echo "syntax OK"

      - name: acceptance fixtures (auto-discovered *.test.mjs)
        run: node pipeline/ci/run-tests.mjs

      - name: import-resolution (entrypoint imports resolve against module exports)
        run: node pipeline/ci/check-imports.mjs

      - name: dead-export (no export kept alive only by its own test — RC-A vestigial-code guard)
        run: node pipeline/ci/check-dead-exports.mjs

      - name: daemon-safety (no local/auto-runnable daemon imports or shells the git-writer — PLAN-DAEMON-SUBSYSTEM)
        run: node pipeline/ci/check-daemon-safety.mjs

      - name: archlint (every file ARCHITECTURE.md names resolves on disk — doc-reference guard E7)
        run: node pipeline/ci/lint-arch.mjs

      - name: skill-lint (every SKILL.md rule-block tagged, P7)
        run: node pipeline/ci/lint-skills.mjs

      - name: doc-lint (denylist of superseded terms + single-source duplicate-phrase, DL1)
        run: node pipeline/ci/lint-docs.mjs

      - name: fills.json / positions.json parse
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['fills.json','positions.json']) {
              JSON.parse(fs.readFileSync(f,'utf8'));
              console.log(f, 'OK');
            }
          "

  # Browser DOM smoke (CI1): the cheap `checks` job above only proves syntax + pure logic.
  # This loads index.html in headless chromium with ALL external network stubbed and fails on
  # any page error / app console error / empty pane — the "syntax passed but the app broke"
  # class the process rules warn about. Separate job so the cheap checks still fail fast.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright + chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Browser DOM smoke
        run: node pipeline/ci/smoke-test.mjs
